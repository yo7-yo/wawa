<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文物探索</title>
    
    <style>
        /* --------------------------------------------------
           [分区 1]: 全局设计规范 (Design Tokens)
           -------------------------------------------------- */
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #1a1a1c;
            --panel-bg: rgba(30, 30, 32, 0.95);
            --border-color: #4a3e2e;
            --text-main: #e5e5e5;
            --accent-red: #a33333;
        }

        /* 基础样式补丁 (say.css 之外的补充) */
        body { background: var(--dark-bg); color: var(--text-main); margin: 0; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; }

        /* --------------------------------------------------
           [分区 2]: 布局组件样式
           -------------------------------------------------- */
        .app-header { border-bottom: 2px solid var(--border-color); padding: 15px; background: #000; }
        .top-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        
        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle, #2c2c2e 0%, #000 100%); }
        #loading-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--primary-gold); }

        .chat-panel { height: 40vh; background: var(--panel-bg); display: flex; flex-direction: column; border-top: 2px solid var(--border-color); }
        #chat-history { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; }
        
        .input-area { display: flex; padding: 10px; gap: 8px; background: #252527; }
        .input-area input { flex: 1; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 4px; }

        /* --------------------------------------------------
           [分区 3]: 响应式辅助类
           -------------------------------------------------- */
        .mobile-only { display: none; }
        @media (max-width: 768px) {
            .mobile-only { display: block; }
            .chat-panel { height: 50vh; }
        }
    </style>

    <!-- 核心库依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="app">
        <!-- [顶部导航栏] -->
        <header class="app-header">
            <div class="top-row">
                <select id="lang-select">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
                <!-- 这里的 artifact-name 会通过 JS 动态移动位置 -->
                <input type="text" id="artifact-name" value="皿方罍" readonly style="text-align:center; width: 120px;">
                <button id="blind-box-btn">请君启藏</button>
            </div>
        </header>

        <!-- [3D 展示区] -->
        <main id="canvas-container">
            <div id="loading-overlay">✦ 文物魂魄凝聚中...</div>
        </main>

        <!-- [AI 交互区] -->
        <section class="chat-panel">
            <div id="chat-history">
                <div class="message system-msg">已进入时空隧道，请向文物提问。</div>
            </div>

            <!-- 输入组件 -->
            <div class="input-area">
                <input type="text" id="user-input" placeholder="输入你想问的问题...">
                <button id="send-btn">发送</button>
            </div>

            <!-- 功能控制条 -->
            <div class="controls-bar" style="padding: 10px; display: flex; gap: 5px; justify-content: center;">
                <button id="undo-btn">撤回</button>
                <button id="clear-btn">重置</button>
                <button id="save-btn">归档</button>
            </div>
        </section>
    </div>

    <!-- --------------------------------------------------
         [分区 4]: 核心逻辑大脑 (ArtifactApp)
         -------------------------------------------------- -->
    <script>
        const ArtifactApp = {
            // 1. 初始化入口
            init() {
                this.cacheDOM();
                this.bindEvents();
                this.initLanguage();
                this.handleResponsive();
                console.log("ArtifactApp: 系统已就绪");
            },

            // 2. 缓存 DOM 节点 (提高性能)
            cacheDOM() {
                this.nodes = {
                    langSelect: document.getElementById('lang-select'),
                    artifactName: document.getElementById('artifact-name'),
                    topRow: document.querySelector('.top-row'),
                    controlsBar: document.querySelector('.controls-bar'),
                    chatHistory: document.getElementById('chat-history'),
                    userInput: document.getElementById('user-input')
                };
            },

            // 3. 事件绑定中心
            bindEvents() {
                // 窗口缩放监听
                window.addEventListener('resize', () => this.handleResponsive());
                
                // 语言切换监听
                this.nodes.langSelect.addEventListener('change', (e) => {
                    localStorage.setItem('app_language', e.target.value);
                });

                // 发送逻辑 (示例)
                document.getElementById('send-btn').addEventListener('click', () => this.sendMessage());
            },

            // 4. 响应式布局逻辑 (核心功能)
            handleResponsive() {
                const isMobile = window.innerWidth <= 768;
                const { artifactName, topRow, controlsBar } = this.nodes;

                if (isMobile) {
                    // 移动端：名字放在顶部
                    if (artifactName.parentNode !== topRow) {
                        topRow.insertBefore(artifactName, topRow.lastElementChild);
                    }
                } else {
                    // PC端：名字放在底部控制条
                    if (artifactName.parentNode !== controlsBar) {
                        controlsBar.prepend(artifactName);
                    }
                }
            },

            // 5. 语言初始化
            initLanguage() {
                const saved = localStorage.getItem('app_language') || 'zh';
                this.nodes.langSelect.value = saved;
            },

            // 6. 对话逻辑 (伪代码)
            sendMessage() {
                const text = this.nodes.userInput.value;
                if(!text) return;
                // 此处对接后端 AI 接口
                this.nodes.chatHistory.innerHTML += `<div><b>你:</b> ${text}</div>`;
                this.nodes.userInput.value = '';
            }
        };

        // 启动应用
        document.addEventListener('DOMContentLoaded', () => ArtifactApp.init());
    </script>
</body>
</html>
