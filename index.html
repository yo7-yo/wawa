        let matchedKey = "博物馆"; 
        const pool = ZONE_CONFIG[matchedKey].models;

    }
    function runAIProgress() {
        const bar = document.getElementById('aiBar');
        const log = document.getElementById('aiLog');
        bar.style.width = "0%";
        let width = 0;
        const timer = setInterval(() => {
            width += Math.random() * 4;
            if (width > 30 && width < 60) log.innerText = "正在描绘人形轮廓...";
            if (width > 60 && width < 90) log.innerText = "正在赋予文物灵性...";
            if (width >= 100) {
                clearInterval(timer);
                log.innerText = "✨ 唤醒成功！";
                setTimeout(showResult, 500);
            }
            bar.style.width = width + "%";
        }, 80);
    }
    function showResult() {
        window.gotoPage('mascotPage');
        document.getElementById('namingSection').style.display = 'block';
        document.getElementById('actionSection').style.display = 'none';
        document.getElementById('artifactNameDisplay').innerText = currentArtifactName;

    window.confirmModelName = function() {
        const input = document.getElementById('customNameInput');
        const name = input.value.trim();
        if(!name) { alert("客官，给它取个名字再走吧！"); return; }
        
        userCustomName = name;

        document.getElementById('namingSection').style.display = 'none';
        document.getElementById('actionSection').style.display = 'block';
        document.getElementById('finalNameDisplay').innerText = `✨ ${finalFullName} ✨`;
        
        // --- 生成带参数的 URL 二维码 ---
        // 获取当前网址（去除旧参数）
        const baseUrl = window.location.href.split('?')[0];
        // 构造新链接：网址 + ?m=模型路径 + &n=完整名字
        const shareUrl = `${baseUrl}?m=${encodeURIComponent(selectedModelPath)}&n=${encodeURIComponent(finalFullName)}`;
        
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(shareUrl)}`;

        qrImg.onload = () => { qrImg.style.display = "block"; };

    window.backToMap = function() {
        cleanUpThreeJS();
        // 清除 URL 参数，防止刷新又回到结果页
        window.history.replaceState({}, document.title, window.location.pathname);
        window.gotoPage('mapPage');
    }
    // === THREE.js & AR Logic ===
    async function loadAiModels() {
        if (handLandmarker) return true;
        if (aiLoadFailed) return false;
        showLoading(true, "启动 AI 引擎...");
        try {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            if (!handLandmarker) {
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: "./hand_landmarker.task", delegate: "GPU", modelComplexity: 0 },
                    runningMode: "VIDEO",
                    numHands: 1
                });
            }
            return true;
        } catch (error) {
            aiLoadFailed = true;
            alert("⚠️ AI模型加载失败！\n(已自动切换为手动模式)");
            showLoading(false);
            return false;
        }
    }
    window.enterARMode = async function() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("⚠️ 请使用 HTTPS 或 Localhost。"); return;
        }
        const modelsLoaded = await loadAiModels();
        if (!modelsLoaded) { showLoading(false); return; }
        
        showLoading(false);
        const btn = document.querySelector('#arInstructions .instructions-btn');
        btn.textContent = '开启奇妙之旅';
        btn.onclick = startArExperience;
        document.getElementById('arInstructions').style.display = 'flex';
    }
    window.startArExperience = async function() {
    document.getElementById('arInstructions').style.display = 'none';
    showLoading(true, "启动相机...");
    try {
        try {
            arStreamObj = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
        } catch (e) { 
            arStreamObj = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); 
        }
        
        const bgVideo = document.getElementById('bgVideo');
        bgVideo.srcObject = arStreamObj;
        bgVideo.style.display = "block";
        await bgVideo.play();
        
        showMascot(true);
        document.getElementById('mascotPage').classList.add('ar-mode-active');
        document.getElementById('arControls').style.display = 'block';
        
        // --- ✨ 核心修正：初始化 Raycaster 并添加拖动事件监听 ---
        raycaster = new THREE.Raycaster();
        const domElement = renderer.domElement;
        domElement.addEventListener('pointerdown', onDragStart);
        domElement.addEventListener('pointermove', onDragMove);
        domElement.addEventListener('pointerup', onDragEnd);
        domElement.addEventListener('pointercancel', onDragEnd);
        // (结束修正)
        isAiRunning = true;
        predictWebcam();
        showTempStatus("探索AR模式已开启");
    } catch (err) {
        alert("相机启动失败: " + err.message);
        exitARMode();
    } finally {
        showLoading(false);
    }
}
    window.showArInstructions = function() {
        const btn = document.querySelector('#arInstructions .instructions-btn');
        btn.textContent = '关闭说明';
        btn.onclick = () => { document.getElementById('arInstructions').style.display = 'none'; };
        document.getElementById('arInstructions').style.display = 'flex';
    }
    async function predictWebcam() {
        if (!isAiRunning) return;
        const video = document.getElementById('bgVideo');
        if (video.readyState >= 2) {
            let startTimeMs = performance.now();
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (!aiLoadFailed && handLandmarker) {
                    const handResult = handLandmarker.detectForVideo(video, startTimeMs);
                    if (handResult.landmarks && handResult.landmarks.length > 0) {
                        handleHandGestures(handResult.landmarks[0]);
                    }
                }
            }
        }
        requestAnimationFrame(predictWebcam);
    }
function handleHandGestures(landmarks) {
    if (isDragging) return; 
    if (!model || !landmarks || landmarks.length === 0) {
        lastRotationAngle = null; 
        return;
    }
    const [
        wrist, thumb_cmc, thumb_mcp, thumb_ip, thumb_tip,
        index_mcp, index_pip, index_dip, index_tip, // index_tip is landmarks[8]
        middle_mcp, middle_pip, middle_dip, middle_tip,
        ring_mcp, ring_pip, ring_dip, ring_tip,
        pinky_mcp, pinky_pip, pinky_dip, pinky_tip
    ] = landmarks;
    const isIndexStraight = index_tip.y < index_pip.y;
    const isMiddleStraight = middle_tip.y < middle_pip.y;
    const isRingStraight = ring_tip.y < ring_pip.y;
    const isPinkyStraight = pinky_tip.y < pinky_pip.y;
    
    // 计算伸出的手指数量
    const straightFingers = [isIndexStraight, isMiddleStraight, isRingStraight, isPinkyStraight].filter(Boolean).length;
    // --- 核心逻辑：根据手指数执行唯一操作 ---
    // 1. 握拳 (缩小)
    if (straightFingers === 0) {
        if (model.scale.x > 0.4) {
            model.scale.multiplyScalar(0.98); 
        }
        showTempStatus("✊ 缩小");
        lastRotationAngle = null;
    }
    // 2. ✨ 单指指向 (贴近)
    else if (straightFingers === 1 && isIndexStraight) {
        // 采用更优的坐标算法，自动处理镜像问题
        const x = (1 - index_tip.x) * 2 - 1; 
        const y = -(index_tip.y * 2 - 1);
        // 通过射线投射，将模型放置在镜头前固定距离
        const vec = new THREE.Vector3(x, y, 0.5);
        vec.unproject(camera);
        const dir = vec.sub(camera.position).normalize();
        const newPos = camera.position.clone().add(dir.multiplyScalar(3));
        // 使用更平滑的lerp动画
        model.position.lerp(newPos, 0.05);
        showTempStatus("☝️ 贴近");
        lastRotationAngle = null;
    }
    // 3. "V"字手势 (顺时针旋转)
    else if (straightFingers === 2 && isIndexStraight && isMiddleStraight) {
        if (lastRotationAngle === null) {
            const rotationAngle = Math.PI / 6; 
            model.rotation.y -= rotationAngle; 
            showTempStatus("✌️ 顺时针旋转30°");
            lastRotationAngle = 1; // 标记为已旋转，防止连续触发
        }
    }
    // 4. 三指手势 (逆时针旋转)
    else if (straightFingers === 3 && isIndexStraight && isMiddleStraight && isRingStraight) {
        if (lastRotationAngle === null) {
            const rotationAngle = Math.PI / 6; 
            model.rotation.y += rotationAngle;
            showTempStatus("🤟 逆时针旋转30°");
            lastRotationAngle = 1; // 标记为已旋转
        }
    }
    // 5. 张手 (放大)
    else if (straightFingers === 4) {
        if (model.scale.x < 2.5) {
             model.scale.multiplyScalar(1.02);
        }
        showTempStatus("🖐️ 放大");
        lastRotationAngle = null;
    }
    // 6. 中立状态 (重置一次性动作)
    else {
        lastRotationAngle = null;
    }
}
    function showTempStatus(text) {
        const el = document.getElementById('aiStatus');
        el.innerText = text; el.style.opacity = '1';
        if(statusTimer) clearTimeout(statusTimer);
        statusTimer = setTimeout(() => { el.style.opacity = '0'; }, 3000);
    }
    window.toggleMirror = function() {
        isMirrored = !isMirrored;
        const v = document.getElementById('bgVideo');
        if (isMirrored) { v.classList.add('mirrored'); showTempStatus("🔁 镜像开启"); }
        else { v.classList.remove('mirrored'); showTempStatus("🔁 镜像关闭"); }
    }
    window.resetModelPos = function() {
        if(model) {
            model.position.set(0, -0.5, -3); // 重置到AR默认位置
            
            // --- ✨ 核心修正：使用与AR初始加载时完全相同的旋转逻辑 ---
            model.rotation.y = Math.PI + (Math.PI / 2); 
            
            // 重新计算并设置一个适合归位后观察的缩放值
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const s = 1.5 / Math.max(size.x, size.y, size.z);
            model.scale.set(s,s,s);
            
            if (controls) controls.reset();
            showTempStatus("📍 已归位");
        }
    }
    window.exitARMode = function() {
    isAiRunning = false;
    if (arStreamObj) arStreamObj.getTracks().forEach(track => track.stop());
    arStreamObj = null;
    
    // --- ✨ 核心修正：移除拖动事件监听 ---
    if (renderer) {
        const domElement = renderer.domElement;
        domElement.removeEventListener('pointerdown', onDragStart);
        domElement.removeEventListener('pointermove', onDragMove);
        domElement.removeEventListener('pointerup', onDragEnd);
        domElement.removeEventListener('pointercancel', onDragEnd);
    }
    // (结束修正)
    document.getElementById('bgVideo').style.display = "none";
    document.getElementById('mascotPage').classList.remove('ar-mode-active');
    document.getElementById('arControls').style.display = 'none';
    showMascot(false);
}
    function cleanUpThreeJS() {
        if (animationId) cancelAnimationFrame(animationId);
        if (renderer) { renderer.domElement.remove(); renderer.dispose(); }
        if (controls) { controls.dispose(); }
        scene = null; camera = null; renderer = null; model = null; controls = null;
    }
const gltfLoader = new GLTFLoader();
const ktx2Loader = new KTX2Loader();
function showMascot(isAR) {
    cleanUpThreeJS();
    const wrap = document.getElementById("mascotCanvasWrap");
    if(!wrap) return;
    if(isAR) wrap.innerHTML = "";
    const width = isAR ? window.innerWidth : wrap.clientWidth;
    const height = isAR ? window.innerHeight : wrap.clientHeight;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    camera.position.set(0, 1.2, 3);
    camera.lookAt(0, 0.5, 0);
    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    if (isAR) {
        document.body.appendChild(renderer.domElement);
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '50';
    } else {
        wrap.appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 20.0;
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2 + Math.PI / 9;
    }
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);
    // --- 💡 关键修正：先配置，后加载 ---
    // 1. 设置KTX2解码器路径
    const basisPath = 'https://unpkg.com/three@0.158.0/examples/jsm/libs/basis/';
    ktx2Loader
        .setTranscoderPath(basisPath)
        .detectSupport(renderer); // detectSupport需要传入renderer
        
    // 2. 将 Meshopt 解码器设置给gltfLoader
    gltfLoader.setMeshoptDecoder(MeshoptDecoder); // <-- 2. SET THE DECODER

    // 3. 将配置好的ktx2Loader设置给gltfLoader
    gltfLoader.setKTX2Loader(ktx2Loader);
    
    // 4. 使用已经配置好的 gltfLoader 实例来加载模型
    gltfLoader.load(selectedModelPath, (gltf) => {
        model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const baseScale = 2.0 / Math.max(size.x, size.y, size.z);
        model.scale.set(baseScale, baseScale, baseScale);
        const center = box.getCenter(new THREE.Vector3());
        model.position.x = -center.x * baseScale;
        model.position.y = -center.y * baseScale;
        model.position.z = -center.z * baseScale;
        if (isAR) {
            model.position.y = -0.5;
            model.position.z = -3;
            model.rotation.y = Math.PI + (Math.PI / 2);
        }
        scene.add(model);
        animate();
    }, undefined, (err) => {
        console.error('模型加载失败:', err);
        alert(`加载失败: ${selectedModelPath}。\n请确认模型文件存在且网络正常。`);
    });
}
    function animate() {
        animationId = requestAnimationFrame(animate);
        // 如果有控制器（结果页），更新控制器
        if (controls) {
            controls.update();
        } 
        // 如果是AR模式且没有AI控制，保留简单自转
        else if (model && document.getElementById('mascotPage').classList.contains('ar-mode-active')) {
            // AR 模式下通常由手势控制，这里不设自动旋转，或者你可以加 model.rotation.y += 0.05;
        }
        renderer.render(scene, camera);
    }
    // AR模式下拍照
    window.takePhoto = function() {
        const bgVideo = document.getElementById('bgVideo');
        const glCanvas = renderer.domElement;
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const vRatio = bgVideo.videoWidth / bgVideo.videoHeight;
        const cRatio = canvas.width / canvas.height;
        let sW, sH, sX, sY;
        if (vRatio > cRatio) {
            sH = bgVideo.videoHeight; sW = sH * cRatio; sX = (bgVideo.videoWidth - sW)/2; sY = 0;
        } else {
            sW = bgVideo.videoWidth; sH = sW / cRatio; sX = 0; sY = (bgVideo.videoHeight - sH)/2;
        }
        ctx.save();
        if (isMirrored) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(bgVideo, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);
        const link = document.createElement('a');
        link.download = `AR_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showTempStatus("📸 照片已保存");
    }
window.toggleVideoRecord = function() {
    if (isRecording) {
        // --- 停止录制 ---
        if (mediaRecorder) mediaRecorder.stop();
        if (recorderAnimationId) cancelAnimationFrame(recorderAnimationId);
        recorderAnimationId = null;
        isRecording = false;
        document.getElementById('arVideoBtn').classList.remove('recording');
    } else {
        // --- 开始录制 ---
        const bgVideo = document.getElementById('bgVideo');
        const glCanvas = renderer.domElement;
        const compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = window.innerWidth;
        compositeCanvas.height = window.innerHeight;
        const compositeCtx = compositeCanvas.getContext('2d');
        function recordFrame() {
            const vRatio = bgVideo.videoWidth / bgVideo.videoHeight;
            const cRatio = compositeCanvas.width / compositeCanvas.height;
            let sW, sH, sX, sY;
            if (vRatio > cRatio) {
                sH = bgVideo.videoHeight;
                sW = sH * cRatio;
                sX = (bgVideo.videoWidth - sW) / 2;
                sY = 0;
            } else {
                sW = bgVideo.videoWidth;
                sH = sW / cRatio;
                sX = 0;
                sY = (bgVideo.videoHeight - sH) / 2;
            }
            
            compositeCtx.save();
            if (isMirrored) { 
                compositeCtx.translate(compositeCanvas.width, 0); 
                compositeCtx.scale(-1, 1); 
            }
            compositeCtx.drawImage(bgVideo, sX, sY, sW, sH, 0, 0, compositeCanvas.width, compositeCanvas.height);
            compositeCtx.restore();
            
            compositeCtx.drawImage(glCanvas, 0, 0, compositeCanvas.width, compositeCanvas.height);
            
            recorderAnimationId = requestAnimationFrame(recordFrame);
        }
        recordFrame(); 
        const stream = compositeCanvas.captureStream(30); // 录制帧率
        recordedChunks = [];
        try {
            // --- ✨ 核心修正：设置视频比特率以提高清晰度 ---
            const options = { 
                mimeType: 'video/webm',
                videoBitsPerSecond: 2500000 // 设置为 2.5 Mbps，这是提升画质的关键
            };
            
            mediaRecorder = new MediaRecorder(stream, options);
            mediaRecorder.ondataavailable = (e) => { 
                if (e.data.size > 0) recordedChunks.push(e.data); 
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AR_Video_${Date.now()}.webm`;
                a.click();
                showTempStatus("💾 视频已保存");
            };
            mediaRecorder.start();
            isRecording = true;
            document.getElementById('arVideoBtn').classList.add('recording');
            showTempStatus("🎥 录制中...");
        } catch(e) { 
            alert("录制不支持或出错: " + e.message);
            if(recorderAnimationId) cancelAnimationFrame(recorderAnimationId); 
        }
    }
}
    function showLoading(show, text) {
        document.getElementById('loadingToast').style.display = show ? 'flex' : 'none';
        if(text) document.getElementById('loadingText').innerText = text;
    }
    // ✨ --- 处理拖动逻辑的函数 --- ✨
function onDragStart(event) {
    if (!model) return;
    // 获取指针在屏幕上的标准化坐标 (-1 to +1)
    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
    // 更新射线发射器
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObject(model, true);
    // 如果射线击中了模型
    if (intersects.length > 0) {
        isDragging = true; // 开始拖动
        // 创建一个虚拟平面，该平面在模型的当前位置并面向相机
        const cameraDirection = camera.getWorldDirection(new THREE.Vector3());
        dragPlane.setFromNormalAndCoplanarPoint(cameraDirection, intersects[0].point);
        // 计算射线与平面的交点，并记录下初始偏移量
        if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
            offset.copy(intersection).sub(model.position);
        }
    }
}
function onDragMove(event) {
    if (isDragging) {
        // 更新指针坐标
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        // 计算射线与虚拟平面的新交点
        if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
            // 将模型移动到新交点的位置，同时减去初始偏移量，使拖动更自然
            model.position.copy(intersection.sub(offset));
        }
    }
}
function onDragEnd(event) {
    isDragging = false; // 结束拖动
}
</script>
