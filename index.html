<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文物探索</title>
    <link rel="stylesheet" href="say.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.17.0/meshopt_decoder.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>文物秘语</h1>
            
            <select id="lang-select" class="secondary-btn">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="ja">日本語</option>
            </select>
        </header>
        <div id="canvas-container">
            <div id="loading-overlay">文物出库中...</div>
        </div>
        <div class="chat-panel">
            
            <div class="input-area">
                <input type="text" id="user-input" placeholder="请在此输入您的对话...">
                <button id="send-btn" class="primary-btn">发送</button>
            </div>
            <div id="chat-history">
                <div class="message system-msg">有兴趣和我一起聊聊天吗,我定知无不言、言无不尽...</div>
            </div>
            
            <div class="controls-bar">
                <!-- ★★★ 修改点：添加了灰色背景和边框 ★★★ -->
                <input type="text" id="artifact-name" value="皿方罍" placeholder="设定文物名称" title="设定文物身份" readonly style="color: #B8860B; background-color: #2c2c2e; border: 1px solid #444; border-radius: 5px; padding: 5px; font-weight: bold; font-size: 1.1em; text-align: center;">
                <div class="action-buttons">
                    <button id="undo-btn" class="secondary-btn">↩️ 撤回</button>
                    <button id="retry-btn" class="secondary-btn">🔄 重试</button>
                    <button id="clear-btn" class="secondary-btn">🗑️ 清空</button>
                    <button id="save-btn" class="secondary-btn">💾 保存</button>
                </div>
            </div>
            
            <div id="selection-controls" class="controls-bar" style="display: none;">
                <p id="selection-counter">已选中 0 组对话</p>
                <div class="action-buttons">
                    <button id="cancel-selection-btn" class="secondary-btn">❌ 取消</button>
                    <button id="delete-selected-btn" class="primary-btn" style="background: #a33;">🗑️ 删除选中</button>
                </div>
            </div>
        </div>
    </div>
    <div id="clear-modal" class="modal">
        <div class="modal-content">
            <h3>⚠️ 警告：记忆消除</h3>
            <p>您即将清空与文物的对话记录。</p>
            <p>为了确认您的操作，请输入：<br><span class="highlight-text">确认清空</span></p>
            <input type="text" id="verify-input" placeholder="在此输入确认文字...">
            <div class="modal-buttons">
                <button id="cancel-clear" class="secondary-btn">取消</button>
                <button id="confirm-clear" class="primary-btn" style="background: #a33;">强制执行</button>
            </div>
        </div>
    </div>
    <script src="say.js"></script>
    <button 
        onclick="window.location.href='wawa.html'" 
        id="blind-box-btn"
        data-lang-zh="请君启藏"
        data-lang-en="Draw Box"
        data-lang-de="Box Ziehen"
        data-lang-ja="盲箱引く"
        请君启藏
    </button>
    </html>
