    <style>
                        /* 第三个页面：盲盒页面 */

            position: fixed; 
            inset: 0;

            justify-content: center; 
            align-items: center; 
        }

            top: 15px;
            right: 15px;

            justify-content: center;

        }

            margin-bottom: 8px;

        body.ar-mode-global #back-to-index-btn,
        body.ar-mode-global #lang-select {
            display: none !important;
        }

        left: 20px;

        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6); /* 半透明黑色背景 */

        cursor: pointer;

        background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FCD34D%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22/%3E%3C/svg%3E');
        background-repeat: no-repeat;

        padding-right: 30px;

    /* --- 解决手机端软键盘遮挡的完美方案 --- */
    /* 仅在屏幕宽度小于 768px（手机端）时，激活输入框才会触发形变 */
    @media screen and (max-width: 768px) {
        /* 手机端返回按钮放大 */
        #back-to-index-btn {
            font-size: 12px !important;
            padding: 6px 14px !important;
            border-radius: 25px !important;
            top: 15px !important;
            right: 15px !important;
        }
        
        /* 输入时：彻底隐藏模型区域，输入框和按钮紧密往上 */
        #mascotPage.input-focused #mascotCanvasWrap {
            display: none !important;    /* 彻底隐藏模型 */
        }
        
        /* 隐藏所有不必要的文字，为输入框腾出空间 */
        #mascotPage.input-focused .congrats-title,
        #mascotPage.input-focused #namingSection p:first-of-type,
        #mascotPage.input-focused #nameErrorMsg {
            display: none !important;
        }
        
        /* namingSection 紧密排列 */
        #mascotPage.input-focused #namingSection {
            gap: 0 !important;
            margin: 0 !important;
            padding: 10px 15px !important;
        }
        
        /* 输入框容器（flex）：消除所有间隔 */
        #mascotPage.input-focused div[style*="display: flex"][style*="gap"] {
            gap: 0 !important;
            margin: 0 !important;
        }
        
        /* 输入框：贴边，无外边距 */
        #mascotPage.input-focused #mascotNameInput {
            margin: 0 !important;
            padding: 10px 12px !important;
        }
        
        /* 经历按钮：紧贴输入框，无间隔 */
        #mascotPage.input-focused #infoBtn {
            margin: 0 !important;
            flex-shrink: 0;
            height: 40px !important;
            padding: 0 14px !important;
        }
    }
    /* PC端完全不受影响，不发生任何形变 */

    #mascotPage {
        position: relative;      /* 相对定位，限制子元素绝对定位范围 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;        /* 限制子元素不能溢出 */
        height: 100vh;           /* 整个结果页高度 */
        width: 100%;
    }

    #arControls .ar-btn {
        z-index: 3000;   /* 控件总是最上层 */
    }

    #lang-select:hover {
        background-color: rgba(20, 20, 20, 0.8);
    }
        /* --- ★★★ 新增：右上角返回按钮的样式 ★★★ --- */
        #back-to-index-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2001; /* 确保在最上层 */
            
            background: rgba(0, 0, 0, 0.6);   /* 半透明黑色背景 */
            color: #fcd34d;                  /* 金色文字 */
            border: 1px solid #fcd34d;      /* 金色边框 */
            
            padding: 3px 11px;
            border-radius: 20px;             /* 圆角 */
            text-decoration: none;           /* 移除链接下划线 */
            font-weight: bold;
            font-size: 9px;
            
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #back-to-index-btn:hover {
            background: rgba(252, 211, 77, 0.2); /* 悬浮时增加金色辉光效果 */
            box-shadow: 0 0 10px rgba(252, 211, 77, 0.5);
        }

        /* 标题样式：字号再次加大，视觉冲击力极强 */
        .cover-title {
            color: #fcd34d;
            font-weight: bold;
            text-shadow: 0 4px 15px rgba(245, 158, 11, 0.8); /* 稍微加强阴影，字大了要有厚度感 */
            
            /* 再次增加顶部外边距，防止超大字号撞到右上角按钮 */
            margin-top: 110px; 
            margin-bottom: 30px; 
            
            animation: fadeInDown 1.5s ease-out; 
            line-height: 1.3; /* 字号大了，行间距稍微收紧一点点更有力 */
            padding: 0 15px;  

            /* --- 核心修改：在之前基础上再加 8px --- */
            /* 最小值约 41px，最大值 56px */
            font-size: clamp(41px, 12vw, 56px); 
            
            text-align: center;
            width: 100%;
            
            /* 保证中文成词显示，配合 <br> 换行 */
            word-break: keep-all; 
            white-space: normal;
        }

        /* 德语和日语单词太长，字号不能无限制大，否则会撑破屏幕 */
        body[lang="ja"] .cover-title{
            font-size: clamp(35px, 8vw, 38px);
        }

        /* 移动端"经历"按钮增大 */
        #infoBtn {
            height: 42px !important;
            padding: 0 20px !important;
            font-size: 13px !important;
            line-height: 42px;
        }

        /* --- ★★★ 仅在 PC 端生效 (屏幕宽度大于 1024px) ★★★ --- */
        @media screen and (min-width: 1024px) {
            /* PC端调整布局防止文字与模型重叠 */
            #mascotCanvasWrap {
                max-height: 45vh !important;
                flex: 0 0 45vh !important;
            }

            /* 1. 标题：强制一行，字号依然保持大气 */
            .cover-title {
                font-size: 70px !important; 
                white-space: nowrap !important; 
                margin-top: 70px !important;    
                margin-bottom: 30px !important;
                letter-spacing: 3px !important;
            }

            /* 隐藏标题里的换行指令 */
            .cover-title br {
                display: none !important;
            }

            /* 2. 返回按钮：缩小 4px (从 26px 调至 22px) */
            #back-to-index-btn {
                font-size: 14px !important; 
                padding: 4px 22px !important; /* 填充也同步微调，显得更精致 */
                border-radius: 35px !important;
                top: 25px !important; 
                right: 25px !important;
            }

            /* 3. 语言选择器：同步微调字号 */
            #lang-select {
                font-size: 18px !important;
                padding: 10px 35px 10px 12px !important;
                top: 25px !important;
                left: 25px !important;
            }

            /* 4. 首页按钮布局：PC 端保持垂直排列 (图鉴在抽取下方) */
            #mapStartButtonContainer {
                display: flex !important;
                flex-direction: column !important; /* 强制垂直排列 */
                align-items: center !important;
                gap: 35px !important; /* 按钮之间的上下间距 */
                margin-top: 30px !important;
            }

            /* PC 端按钮宽度可以稍微加宽，适应大屏幕 */
            .blind-box-btn {
                max-width: 320px !important;
            }

            /* 5. PC端经历按钮定位到右上角 */
            .result-card {
                position: relative !important;
            }

            #infoBtn,
            #infoBtnAction {
                position: absolute !important;
                top: 15px !important;
                right: 15px !important;
                width: 50px !important;
                height: 50px !important;
                border-radius: 50% !important;
                padding: 0 !important;
                font-size: 14px !important;
                z-index: 100 !important;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(to bottom, #fcd34d, #d97706);
                color: #450a0a;
                font-weight: 900;
                border: none;
                box-shadow: 0 4px 0 #92400e;
                cursor: pointer;
                transition: transform 0.2s;
            }

            #infoBtn:active,
            #infoBtnAction:active {
                transform: scale(0.96);
            }

            /* PC端二维码区域上移 */
            .qr-action-wrapper {
                margin: -20px 0 15px 0 !important; /* 负margin让二维码整体上移 */
            }
        }
        /* 5. 修正起名字环节的文字排版，防止它们太靠近屏幕边缘 */
        #namingSection p, #actionSection p {
            padding: 0 15px;
            line-height: 1.6;
            /* ★★★ 缩小边距，为在一页内显示留空间 */
            margin-bottom: 8px;
            font-size: 15px;
        }

        #namingSection p, #actionSection p {
            margin: 5px 0;
            line-height: 1.5;
        }

        /* 专门针对日语的缩放，防止长难句溢出 */
        body[lang="ja"] .cover-title {
            font-size: clamp(24px, 6.5vw, 34px);
            letter-spacing: -1px; /* 紧凑一点 */
        }

        /* 按钮文字自动缩小，防止四字以上溢出 */
        .instructions-btn {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 盲盒按钮：保持原本较宽的尺寸 */
        .blind-box-btn {
            width: 100%;
            max-width: 280px;
            padding: 15px 0 !important;
            font-size: 20px !important;
        }

        /* 图鉴按钮：宽度自适应字数，高度和字号与盲盒按钮一致 */
        #galleryBtn {
            width: auto !important;         /* 宽度自适应 */
            padding: 10px 28px !important;  /* 左右边距撑开宽度 */
            font-size: 16px !important;
            margin: 0 0 30px 0;             /* 手机端：增加底部距离 */
        }

        /* --- ★★★ PC 端专属适配 ★★★ --- */
        @media screen and (min-width: 768px) {
            .cover-title {
                /* PC端字号：保持加大的 65px */
                font-size: 65px; 
            }
            
            /* PC端图鉴按钮：固定到左下角 */
            #galleryBtn {
                            padding: 10px 28px !important; 
                            font-size: 16px !important;
                            margin: 0 !important;           /* PC端：取消底部距离 */
                        }
        }
        /* ★★★ 新增：标题入场动画 ★★★ */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* --- ★★★ 新增：动态光点装饰 ★★★ --- */
        #sparkles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none; /* 确保装饰不会干扰点击 */
        }
        .sparkle {
            position: absolute;
            bottom: -20px; /* 从底部开始 */
            background-color: #fcd34d; /* 光点颜色 */
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh); /* 向上移动整个屏幕的高度 */
                opacity: 0;
            }
        }
        /* --- ★★★ 新增：默认隐藏切换镜头按钮 ★★★ --- */
        #arSwitchCameraBtn {
            display: none; /* ★ 默认是隐藏的 */
            top: 74px; 
            right: 20px;
        }
        /* === 基础重置 === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #020617; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
        /* 通用 UI */
        section { position: absolute; inset: 0; display: none; z-index: 10; width: 100%; height: 100%; }
        section.active { display: flex; z-index: 100; }
        div.full-page { position: absolute; inset: 0; display: none; z-index: 50; width: 100%; height: 100%; }
        div.full-page.active { display: block; z-index: 100; }
        /* === AR 操作指南样式 === */
        #arInstructions {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); z-index: 200; display: none;
            justify-content: center; align-items: center; color: #fff;
            text-align: center; padding: 20px;
        }
        .instructions-content {
            background: rgba(20, 20, 20, 0.8); padding: 25px 30px;
            border-radius: 20px; border: 1px solid #fcd34d;
            width: 100%; max-width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .instructions-content ul { list-style: none; padding: 0; margin-bottom: 30px; text-align: left; }
        .instructions-content li { font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; }
        .instructions-content .icon { font-size: 24px; margin-right: 15px; width: 30px; display: inline-block; }
        .instructions-btn {
            background: linear-gradient(to bottom, #fcd34d, #d97706); color: #450a0a;
            font-weight: 900; padding: 14px 40px; border-radius: 30px; border: none;
            box-shadow: 0 4px 0 #92400e; cursor: pointer; font-size: 18px;
            width: 100%; transition: transform 0.2s;
        }
        .instructions-btn:active { transform: scale(0.96); }
        /* === 2. 地图 (首页) - 修改后 === */
        #mapPage {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* ★★★ 修改：背景改为亮红色渐变 ★★★ */
            background: radial-gradient(ellipse at center, #e63946 0%, #8d0812 70%);
        }
        #mapStage {
            position: relative;
            text-align: center;
        }
        #mapImg {
            display: none; /* 隐藏旧地图 */
        }
        
        /* 新增：礼物盒样式 */
        #giftBox {
            font-size: 150px;
            text-shadow: 0 0 15px #fcd34d, 0 0 30px #f59e0b;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 30px;
            /* ★★★ 修改：移除点击手势 ★★★ */
            cursor: default; 
        }
        
        /* 新增：浮动动画 */
        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-25px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
        #mapStartButtonContainer {
            display: flex;
            flex-direction: column; /* 垂直排列 */
            align-items: center;    /* 居中 */
            
            /* --- 核心修改：拉开按钮之间的间距 --- */
            gap: 40px; 
            
            width: 100%;
            margin-top: 20px;
        }
        
        /* === 3. 抽取页 === */
        #aiPage { flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #5e0a0a, #000); }
        .ai-box { width: 80%; max-width: 320px; text-align: center; }

            margin-bottom: 30px; 
            animation: jarShake 0.6s infinite ease-in-out; 
            display: inline-block; 
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); 
        }

            0%, 100% { transform: rotate(0deg); }

            75% { transform: rotate(12deg) translateY(-5px); }

            height: 88vh; 
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #mascotPage.input-focused {
            transform: none;  /* 手机端不移动 */
        }
        
        @media screen and (min-width: 768px) {
            /* PC 端保持原来的向上滑动 */
            #mascotPage.input-focused {
                transform: translateY(-20vh);
            }

    function takePhoto() {
        if (!arModeActive || !videoElement.srcObject) {
            alert('请先进入AR模式并允许摄像头');
            return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

        // 生成下载
        const dataURL = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = dataURL;
        a.download = 'AR_Photo.png';
        a.click();

        alert('📸 照片已保存');
    }

        for (const selector in elementsToTranslate) {
            const el = document.querySelector(selector);
            if (el) el.innerText = t[elementsToTranslate[selector]] || '';
        }

        // 处理所有带有 data-lang-key 属性的元素
        const langKeyElements = document.querySelectorAll('[data-lang-key]');
        langKeyElements.forEach(el => {
            const key = el.getAttribute('data-lang-key');
            if (t[key]) el.innerText = t[key];

        const youAwakenedEl = document.querySelector('#namingSection p');

        const backBtn = document.getElementById('back-to-index-btn');

    function runAIProgress() {
        const bar = document.getElementById('aiBar');
        const log = document.getElementById('aiLog');
        const lang = document.getElementById('lang-select').value || 'zh'; 
        const t = translations[lang];

        bar.style.width = "0%";
        log.innerText = t.awakenLog1; 
        let width = 0;
        const timer = setInterval(() => {
            width += Math.random() * 4;
            if (width > 30 && width < 60) log.innerText = t.awakenLog2; 
            if (width > 60 && width < 90) log.innerText = t.awakenLog3; 
            if (width >= 100) {
                clearInterval(timer);
                log.innerText = t.awakenSuccess; 
                setTimeout(showResult, 500);
            }
            bar.style.width = width + "%";
        }, 80);
    }

function setupInputListeners() {
        const nameInput = document.getElementById('mascotNameInput');
        const mascotPage = document.getElementById('mascotPage');
        const wrap = document.getElementById("mascotCanvasWrap");

        if (nameInput) {
            // ★ 杀手锏：真正的移动端检测（直接识别操作系统），避免 PC 窄屏被误判
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // --- 聚焦：仅在真实手机上触发画布缩小 ---
            nameInput.addEventListener('focus', () => {
                if (isMobileDevice) {
                    mascotPage.classList.add('input-focused');
                    
                    // 模型稍微下沉，防止画布变矮后头被切掉
                    if(model) {
                        model.position.y -= 0.8; 
                    }

                    setTimeout(() => {
                        if (renderer && camera) {
                            camera.aspect = wrap.clientWidth / wrap.clientHeight;
                            camera.updateProjectionMatrix();
                            renderer.setSize(wrap.clientWidth, wrap.clientHeight);
                        }
                    }, 300); 
                }
            });

            // --- 失焦：仅在真实手机上恢复原状 ---
            nameInput.addEventListener('blur', () => {
                if (isMobileDevice) {
                    mascotPage.classList.remove('input-focused');
                    
                    // 模型位置复原
                    if(model) {
                        model.position.y += 0.8; 
                    }

                    setTimeout(() => {
                        if (renderer && camera) {
                            camera.aspect = wrap.clientWidth / wrap.clientHeight;
                            camera.updateProjectionMatrix();
                            renderer.setSize(wrap.clientWidth, wrap.clientHeight);
                        }
                    }, 300);
                }
            });
        }
    }

    // === THREE.js & AR Logic ===
    async function loadAiModels() {
        if (handLandmarker) return true;
        if (aiLoadFailed) return false;
        showLoading(true, 'loadingAI');
        try {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            if (!handLandmarker) {
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: "./hand_landmarker.task", delegate: "GPU", modelComplexity: 0 },
                    runningMode: "VIDEO",
                    numHands: 1
                });
            }
            return true;
        } catch (error) {
            aiLoadFailed = true;
            alert("⚠️ AI模型加载失败！\n(已自动切换为手动模式)");
            showLoading(false);
            return false;
        }
    }
    window.enterARMode = async function() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("⚠️ 请使用 HTTPS 或 Localhost。"); return;
        }
        const modelsLoaded = await loadAiModels();
        if (!modelsLoaded) { showLoading(false); return; }
        
        showLoading(false);
        const btn = document.querySelector('#arInstructions .instructions-btn');
        const t = translations[currentLang] || translations.zh; 
        btn.textContent = t.arBtnStart; 
        btn.onclick = startArExperience;
        document.getElementById('arInstructions').style.display = 'flex';
    }
    window.startArExperience = async function() {
        document.getElementById('arInstructions').style.display = 'none';
        showLoading(true, 'loadingCamera');
        try {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
            document.body.classList.add('mobile-device');
            }
            document.getElementById('arSwitchCameraBtn').style.display = isMobile ? 'flex' : 'none';
            currentFacingMode = isMobile ? 'environment' : 'user';
            
            let videoConstraints;
            if (isMobile) {
                videoConstraints = { facingMode: { exact: currentFacingMode }, width: { ideal: 640 }, height: { ideal: 480 } };
            } else {
                videoConstraints = { width: { ideal: 640 }, height: { ideal: 480 } };
                if (!isMirrored) { toggleMirror(); } 
            }
            try {
                arStreamObj = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
            } catch (e) {
                console.warn("请求指定摄像头失败，尝试备用方案...", e);
                currentFacingMode = 'user'; 
                arStreamObj = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            }
            
            const bgVideo = document.getElementById('bgVideo');
            bgVideo.srcObject = arStreamObj;
            bgVideo.style.display = "block";
            await bgVideo.play();
            
            showMascot(true);
            document.body.classList.add('ar-mode-global');
            document.getElementById('mascotPage').classList.add('ar-mode-active');
            document.getElementById('arControls').style.display = 'block';

const infoBtn = document.getElementById('infoBtn');
const infoBtnAction = document.getElementById('infoBtnAction');
const infoModal = document.getElementById('infoModal');
const closeInfo = document.getElementById('closeInfo');
const infoTextContent = document.getElementById('infoTextContent');

function openInfoModal(e) {
    e.stopPropagation(); 
    
    if (controls) controls.enabled = false;
    
    const langData = ARTIFACT_INFO[currentLang] || ARTIFACT_INFO["zh"];
    
    if (langData[selectedModelPath]) {
        infoTextContent.innerHTML = langData[selectedModelPath];
    } else {
        const fallbackMsg = {
            "zh": "暂无该文物的详细信息。",
            "en": "No detailed information available for this artifact.",
            "ja": "この文化財の詳細情報はありません。",
            "de": "Keine detaillierten Informationen für dieses Artefakt verfügbar."
        };
        const msg = fallbackMsg[currentLang] || fallbackMsg["zh"];
        infoTextContent.innerHTML = `<p style='text-align:center; margin-top: 20px;'>${msg}</p>`;
    }
    
    infoModal.style.display = 'flex';
}

if (infoBtn) infoBtn.onclick = openInfoModal;
if (infoBtnAction) infoBtnAction.onclick = openInfoModal;

if (closeInfo) {
    closeInfo.onclick = () => {
        infoModal.style.display = 'none';
        if (controls) controls.enabled = true;
    };
}

if (infoModal) {
    infoModal.onclick = (e) => {
        if (e.target === infoModal) {
            infoModal.style.display = 'none';
            if (controls) controls.enabled = true;
        }
    };
}

window.addEventListener('load', setupKeyboardAdjustments);
</script>
