    <style>

        /* 1. 强制弹窗在最顶层，完全遮盖 3D 场景 */
        .modal-overlay {
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.9); /* 加深背景，彻底隔绝 3D 干扰 */
            backdrop-filter: blur(10px); 
            z-index: 5000; /* 必须高于所有元素 */
            display: none; 
            justify-content: center; 
            align-items: center; 
        }

        /* 2. 信息按钮样式（防止它在 AR 模式下乱跑） */
        .info-sphere-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            z-index: 200; /* 确保在 3D Canvas 之上 */
            border-radius: 50% !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            color: #fcd34d;
            border: 1px solid #fcd34d;
            cursor: pointer;
        }

        /* 3. 结果卡片的溢出处理 */
        .result-card {
            overflow: visible !important; /* 允许模型稍微超出边框而不被截断 */
        }

        /* 4. 文字内容容器 */
        .info-text-container {
            padding: 20px;
            color: #fde68a;
            font-size: 16px;
            text-align: left;
            max-height: 50vh;
            overflow-y: auto;
        }
        body.ar-mode-global #back-to-index-btn,
        body.ar-mode-global #lang-select {
            display: none !important;
        }
        #lang-select {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 2001; /* 确保在最上层 */

        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6); /* 半透明黑色背景 */
        color: #fcd34d;                  /* 金色文字 */
        border: 1px solid #fcd34d;      /* 金色边框 */
        
        font-weight: bold;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;

        /* 添加自定义的下拉箭头 */
        background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FCD34D%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22/%3E%3C/svg%3E');
        background-repeat: no-repeat;
        background-position: right 12px top 50%;
        background-size: .65em auto;
        padding-right: 30px;
    }

    /* --- 解决软键盘穿模的视觉修正 --- */
    /* 当 mascotPage 激活 input-focused 类时 */
    #mascotPage.input-focused .result-card {
        transform: translateY(-120px); /* 向上移动更多一点，避开键盘 */
        transition: transform 0.3s ease;
    }

    /* 强制缩小模型高度，防止挤占输入框空间 */
    #mascotPage.input-focused #mascotCanvasWrap {
        height: 35vh !important; 
        transition: height 0.3s ease;
    }

    /* 键盘弹出时，隐藏标题节省空间 */
    #mascotPage.input-focused .congrats-title,
    #mascotPage.input-focused #namingSection p {
        display: none;
    }

    #lang-select:hover {
        background-color: rgba(20, 20, 20, 0.8);
    }
        /* --- ★★★ 新增：右上角返回按钮的样式 ★★★ --- */
        #back-to-index-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2001; /* 确保在最上层 */
            
            background: rgba(0, 0, 0, 0.6);   /* 半透明黑色背景 */
            color: #fcd34d;                  /* 金色文字 */
            border: 1px solid #fcd34d;      /* 金色边框 */
            
            padding: 8px 16px;
            border-radius: 20px;             /* 圆角 */
            text-decoration: none;           /* 移除链接下划线 */
            font-weight: bold;
            font-size: 14px;
            
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #back-to-index-btn:hover {
            background: rgba(252, 211, 77, 0.2); /* 悬浮时增加金色辉光效果 */
            box-shadow: 0 0 10px rgba(252, 211, 77, 0.5);
        }

        /* 标题样式：字号再次加大，视觉冲击力极强 */
        .cover-title {
            color: #fcd34d;
            font-weight: bold;
            text-shadow: 0 4px 15px rgba(245, 158, 11, 0.8); /* 稍微加强阴影，字大了要有厚度感 */
            
            /* 再次增加顶部外边距，防止超大字号撞到右上角按钮 */
            margin-top: 110px; 
            margin-bottom: 30px; 
            
            animation: fadeInDown 1.5s ease-out; 
            line-height: 1.3; /* 字号大了，行间距稍微收紧一点点更有力 */
            padding: 0 15px;  

            /* --- 核心修改：在之前基础上再加 8px --- */
            /* 最小值约 41px，最大值 56px */
            font-size: clamp(41px, 12vw, 56px); 
            
            text-align: center;
            width: 100%;
            
            /* 保证中文成词显示，配合 <br> 换行 */
            word-break: keep-all; 
            white-space: normal;
        }

        /* 德语和日语单词太长，字号不能无限制大，否则会撑破屏幕 */
        body[lang="ja"] .cover-title{
            font-size: clamp(35px, 8vw, 38px);
        }

        /* --- ★★★ 仅在 PC 端生效 (屏幕宽度大于 1024px) ★★★ --- */
        /* --- ★★★ 仅在 PC 端生效 (屏幕宽度大于 1024px) ★★★ --- */
        @media screen and (min-width: 1024px) {

            /* 1. 标题：强制一行，字号依然保持大气 */
            .cover-title {
                font-size: 70px !important; 
                white-space: nowrap !important; 
                margin-top: 70px !important;   
                margin-bottom: 30px !important;
                letter-spacing: 3px !important;
            }

            /* 隐藏标题里的换行指令 */
            .cover-title br {
                display: none !important;
            }

            /* 2. 返回按钮：缩小 4px (从 26px 调至 22px) */
            #back-to-index-btn {
                font-size: 22px !important; 
                padding: 12px 30px !important; /* 填充也同步微调，显得更精致 */
                border-radius: 35px !important;
                top: 25px !important; 
                right: 25px !important;
            }

            /* 3. 语言选择器：同步微调字号 */
            #lang-select {
                font-size: 18px !important;
                padding: 10px 35px 10px 12px !important;
                top: 25px !important;
                left: 25px !important;
            }

            /* 4. 首页按钮布局：PC 端保持垂直排列 (图鉴在抽取下方) */
            #mapStartButtonContainer {
                display: flex !important;
                flex-direction: column !important; /* 强制垂直排列 */
                align-items: center !important;
                gap: 35px !important; /* 按钮之间的上下间距 */
                margin-top: 30px !important;
            }

            /* PC 端按钮宽度可以稍微加宽，适应大屏幕 */
            .blind-box-btn {
                max-width: 320px !important;
            }
        }
        /* 5. 修正起名字环节的文字排版，防止它们太靠近屏幕边缘 */
        #namingSection p, #actionSection p {
            padding: 0 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 15px;
        }

        #namingSection p, #actionSection p {
            margin: 10px 0;
            line-height: 1.5;
        }

        /* 专门针对日语的缩放，防止长难句溢出 */
        body[lang="ja"] .cover-title {
            font-size: clamp(24px, 6.5vw, 34px);
            letter-spacing: -1px; /* 紧凑一点 */
        }

        /* 按钮文字自动缩小，防止四字以上溢出 */
        .instructions-btn {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 盲盒按钮：保持原本较宽的尺寸 */
        .blind-box-btn {
            width: 100%;
            max-width: 280px;
            padding: 15px 0 !important;
            font-size: 20px !important;
        }

        /* 图鉴按钮：宽度自适应字数，高度和字号与盲盒按钮一致 */
        #galleryBtn {
            width: auto !important;         /* 宽度自适应 */
            padding: 15px 40px !important;  /* 左右边距撑开宽度 */
            font-size: 20px !important;
            margin: 0;
        }

        /* --- ★★★ PC 端专属适配 ★★★ --- */
        @media screen and (min-width: 768px) {
            .cover-title {
                /* PC端字号：保持加大的 65px */
                font-size: 65px; 
            }
            
            /* PC端图鉴按钮：固定到左下角 */
            #galleryBtn {
                            padding: 10px 28px !important; 
                            font-size: 16px !important; 
                        }
        }
        /* ★★★ 新增：标题入场动画 ★★★ */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* --- ★★★ 新增：动态光点装饰 ★★★ --- */
        #sparkles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none; /* 确保装饰不会干扰点击 */
        }
        .sparkle {
            position: absolute;
            bottom: -20px; /* 从底部开始 */
            background-color: #fcd34d; /* 光点颜色 */
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh); /* 向上移动整个屏幕的高度 */
                opacity: 0;
            }
        }
        /* --- ★★★ 新增：默认隐藏切换镜头按钮 ★★★ --- */
        #arSwitchCameraBtn {
            display: none; /* ★ 默认是隐藏的 */
            top: 74px; 
            right: 20px;
        }
        /* === 基础重置 === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #020617; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
        /* 通用 UI */
        section { position: absolute; inset: 0; display: none; z-index: 10; width: 100%; height: 100%; }
        section.active { display: flex; z-index: 100; }
        div.full-page { position: absolute; inset: 0; display: none; z-index: 50; width: 100%; height: 100%; }
        div.full-page.active { display: block; z-index: 100; }
        /* === AR 操作指南样式 === */
        #arInstructions {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); z-index: 200; display: none;
            justify-content: center; align-items: center; color: #fff;
            text-align: center; padding: 20px;
        }
        .instructions-content {
            background: rgba(20, 20, 20, 0.8); padding: 25px 30px;
            border-radius: 20px; border: 1px solid #fcd34d;
            width: 100%; max-width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .instructions-content h2 { color: #fcd34d; font-size: 24px; margin-bottom: 25px; text-shadow: 0 0 10px #f59e0b; }
        .instructions-content ul { list-style: none; padding: 0; margin-bottom: 30px; text-align: left; }
        .instructions-content li { font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; }
        .instructions-content .icon { font-size: 24px; margin-right: 15px; width: 30px; display: inline-block; }
        .instructions-btn {
            background: linear-gradient(to bottom, #fcd34d, #d97706); color: #450a0a;
            font-weight: 900; padding: 14px 40px; border-radius: 30px; border: none;
            box-shadow: 0 4px 0 #92400e; cursor: pointer; font-size: 18px;
            width: 100%; transition: transform 0.2s;
        }
        .instructions-btn:active { transform: scale(0.96); }
        /* === 2. 地图 (首页) - 修改后 === */
        #mapPage {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* ★★★ 修改：背景改为亮红色渐变 ★★★ */
            background: radial-gradient(ellipse at center, #e63946 0%, #8d0812 70%);
        }
        #mapStage {
            position: relative;
            text-align: center;
        }
        #mapImg {
            display: none; /* 隐藏旧地图 */
        }
        
        /* 新增：礼物盒样式 */
        #giftBox {
            font-size: 150px;
            text-shadow: 0 0 15px #fcd34d, 0 0 30px #f59e0b;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 30px;
            /* ★★★ 修改：移除点击手势 ★★★ */
            cursor: default; 
        }
        
        /* 新增：浮动动画 */
        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-25px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
        #mapStartButtonContainer {
            display: flex;
            flex-direction: column; /* 垂直排列 */
            align-items: center;    /* 居中 */
            
            /* --- 核心修改：拉开按钮之间的间距 --- */
            gap: 40px; 
            
            width: 100%;
            margin-top: 20px;
        }
        
        /* === 3. 抽取页 === */
        #aiPage { flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #5e0a0a, #000); }
        .ai-box { width: 80%; max-width: 320px; text-align: center; }
        .shake-jar { 
            font-size: 180px; 
            margin-bottom: 30px; 
            animation: jarShake 0.6s infinite ease-in-out; 
            display: inline-block; 
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); 
        }
        @keyframes jarShake { 
            0%, 100% { transform: rotate(0deg); } 
            25% { transform: rotate(-12deg) translateY(-5px); } 
            50% { transform: rotate(0deg); } 
            75% { transform: rotate(12deg) translateY(-5px); } 
        }
        .ai-title { color: #fcd34d; font-size: 22px; margin-bottom: 24px; font-weight: bold; text-shadow: 0 0 10px #b45309; }
        .progress-track { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 0.1s linear; }
        .ai-log { margin-top: 15px; color: #fbbf24; font-family: monospace; font-size: 14px; }
        /* === 4. 结果页 === */
        #mascotPage { flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #7f1d1d 100%); }
        .result-card { background: rgba(140, 20, 20, 0.6); border: 2px solid #fcd34d; border-radius: 24px; padding: 25px; width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); transition: all 0.5s; position: relative; z-index: 10; }
        #mascotCanvasWrap { width: 100%; height: 300px; margin-bottom: 10px; position: relative; z-index: 2; }
        
        /* ★★★ 新增：当处于命名阶段时，模型画布变大 ★★★ */
        #mascotPage.naming-active #mascotCanvasWrap {
            height: 60vh;
        }

        .model-info h2 { color: #fcd34d; font-size: 26px; margin-bottom: 8px; }
        .model-info p { color: #fed7aa; font-size: 14px; margin-bottom: 15px; }
        
        #namingSection { display: none; margin-top: 10px; animation: fadeIn 0.5s; }
        .btn-confirm { background: linear-gradient(to bottom, #fcd34d, #d97706); color: #450a0a; font-weight: 900; padding: 12px 40px; border-radius: 30px; border: none; box-shadow: 0 4px 0 #92400e; cursor: pointer; font-size: 18px; margin-top: 20px; }
        
        #actionSection { display: none; margin-top: 15px; animation: fadeIn 0.5s; }
        #qrCodeContainer { margin: 15px auto; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; justify-content: center; align-items: center; border: 2px dashed #fcd34d; }
        #generatedQr { 
            width: 100%; 
            height: 100%; 
            border-radius: 10px; 
            padding: 6px;
            background: #fff;
            display: none; 
        }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; margin-top: 15px; }
        .action-btn { padding: 12px 0; width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; color: #fff; flex: 1; transition: 0.3s; }
        .btn-ar { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fcd34d; width: 100%; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
        /* === 5. AR 界面 === */
        #bgVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; transform: scaleX(1); transition: transform 0.3s; }
        #bgVideo.mirrored { transform: scaleX(-1); }
        #mascotPage.ar-mode-active { background: none !important; pointer-events: none; }
        .ar-mode-active .result-card { background: transparent !important; border: none !important; backdrop-filter: none !important; box-shadow: none !important; }
        .ar-mode-active .model-info, .ar-mode-active .btn-group, .ar-mode-active .btn-back, .ar-mode-active #actionSection, .ar-mode-active #namingSection { display: none !important; }
        #arControls { display: none; position: fixed; inset: 0; z-index: 100; pointer-events: none; }
        .ar-btn {
            position: absolute;
            height: 44px;
            width: auto;
            min-width: 44px;
            padding: 0 16px;
            border-radius: 22px;
            border: none;

        }
        #arExitBtn { top: 20px; left: 20px; background: rgba(220, 38, 38, 0.8); }

        #arToggleGestureBtn { bottom: 94px; left: 20px; }
        #arResetBtn { bottom: 40px; left: 20px; }
        #arMirrorBtn { top: 20px; right: 20px; }
        #arSwitchCameraBtn { top: 74px; right: 20px; display: none; }

        #arVideoBtn.recording { animation: pulseRed 1s infinite; border: 2px solid #fff; background: red; }
        body.mobile-device #arSwitchCameraBtn {
            display: flex;
        }
        
        @keyframes pulseRed { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.8); padding: 8px 16px; border-radius: 20px;
            color: #fff; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        
/* === 7. 纯展示模式 (扫码后的页面) === */

        body.share-mode #namingSection,

        body.share-mode #back-to-index-btn {
            display: none !important;
        }

function handleHandGestures(landmarks) {
    if (isDragging) return;
    
    if (!model || !landmarks || landmarks.length === 0) {
        lastRotationAngle = null; 
        return;
    }
    const [wrist, thumb_cmc, thumb_mcp, thumb_ip, thumb_tip, index_mcp, index_pip, index_dip, index_tip, middle_mcp, middle_pip, middle_dip, middle_tip, ring_mcp, ring_pip, ring_dip, ring_tip, pinky_mcp, pinky_pip, pinky_dip, pinky_tip] = landmarks;
    const isIndexStraight = index_tip.y < index_pip.y;
    const isMiddleStraight = middle_tip.y < middle_pip.y;
    const isRingStraight = ring_tip.y < ring_pip.y;
    const isPinkyStraight = pinky_tip.y < pinky_pip.y;
    const straightFingers = [isIndexStraight, isMiddleStraight, isRingStraight, isPinkyStraight].filter(Boolean).length;
    if (straightFingers === 0) { 
        if (model.scale.x > 0.4) model.scale.multiplyScalar(0.98); 
        showTempStatus("✊ 缩小");
        lastRotationAngle = null;
    } 
    else if (straightFingers === 1 && isIndexStraight) { 
        let x = index_tip.x * 2 - 1;
        if (isMirrored) x = -x;  
        const y = -(index_tip.y * 2 - 1);
        
        const vec = new THREE.Vector3(x, y, 0.5);
        vec.unproject(camera);
        const dir = vec.sub(camera.position).normalize();
        const newPos = camera.position.clone().add(dir.multiplyScalar(3));
        
        model.position.lerp(newPos, 0.05);
        showTempStatus("☝️ 贴近");
        lastRotationAngle = null;
    } else if (straightFingers === 2 && isIndexStraight && isMiddleStraight) { 
        if (lastRotationAngle === null) {
            model.rotation.y -= Math.PI / 6; 
            showTempStatus("✌️ 顺时针旋转30°");
            lastRotationAngle = 1;
        }
    } else if (straightFingers === 3 && isIndexStraight && isMiddleStraight && isRingStraight) { 
        if (lastRotationAngle === null) {
            model.rotation.y += Math.PI / 6;
            showTempStatus("🤟 逆时针旋转30°");
            lastRotationAngle = 1;
        }
    } else if (straightFingers === 4) { 
        if (model.scale.x < 2.5) model.scale.multiplyScalar(1.02);
        showTempStatus("🖐️ 放大");
        lastRotationAngle = null;
    } else { 
        lastRotationAngle = null;
    }

function showMascot(isAR) {
    cleanUpThreeJS();
    const wrap = document.getElementById("mascotCanvasWrap");

    const width = isAR ? window.innerWidth : wrap.clientWidth;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, width / height, 0.01, 100);
    camera.position.set(0, 1.2, 3);
    camera.lookAt(0, 0.5, 0);
    renderer = new THREE.WebGLRenderer({ 
        alpha: true, 
        antialias: true, // 开启抗锯齿
        preserveDrawingBuffer: true,
        logarithmicDepthBuffer: true // 开启对数深度缓存，解决穿模闪烁
    });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    // 👇 --- 新增以下两行 --- 👇
    // 强制开启 sRGB 色彩空间，解决 GLTF/GLB 模型发灰发暗的终极方案
    renderer.outputColorSpace = THREE.SRGBColorSpace; 
    // 适当提高曝光度 (默认是 1.0，觉得不够亮可以调到 1.5 甚至 2.0)
    renderer.toneMappingExposure = 1.2; 
    // 👆 ---------------------- 👆
    if (isAR) {
        document.body.appendChild(renderer.domElement);

        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '50';
    } else {
        wrap.appendChild(renderer.domElement);
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        controls.autoRotateSpeed = isMobile ? 5.0 : 10.0; 
        controls.enableZoom = true;
        controls.maxPolarAngle = Math.PI / 2 + Math.PI / 9;

    // 1. 全局环境光：提亮基础暗部 (强度从 1.0 提高到 1.5)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    // 👇 --- 这是你漏掉的半球光 --- 👇
    // 半球光：模拟天光与地面的漫反射，非常适合青铜器/陶器质感
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    // 2. 主平行光：模拟强光直射，打出高光 (强度从 2.0 提高到 3.0)
    const mainLight = new THREE.DirectionalLight(0xffffff, 3.0);

    const backLight = new THREE.DirectionalLight(0xffffff, 1.5);

            controls.update();
        } 
        else if (model && document.getElementById('mascotPage').classList.contains('ar-mode-active')) {
        }
        renderer.render(scene, camera);
    }
    window.takePhoto = function() {
        const bgVideo = document.getElementById('bgVideo');
        const glCanvas = renderer.domElement;
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const vRatio = bgVideo.videoWidth / bgVideo.videoHeight;
        const cRatio = canvas.width / canvas.height;
        let sW, sH, sX, sY;
        if (vRatio > cRatio) {
            sH = bgVideo.videoHeight; sW = sH * cRatio; sX = (bgVideo.videoWidth - sW)/2; sY = 0;
        } else {
            sW = bgVideo.videoWidth; sH = sW / cRatio; sX = 0; sY = (bgVideo.videoHeight - sH)/2;
        }
        ctx.save();
        if (isMirrored) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(bgVideo, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);
        const link = document.createElement('a');
        link.download = `AR_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showTempStatus(translations[currentLang].photoSavedToast);
    }
window.toggleVideoRecord = function() {
    if (isRecording) {
        if (mediaRecorder) mediaRecorder.stop();
        if (recorderAnimationId) cancelAnimationFrame(recorderAnimationId);
        recorderAnimationId = null;
        isRecording = false;
        document.getElementById('arVideoBtn').classList.remove('recording');
    } else {
        const bgVideo = document.getElementById('bgVideo');
        const glCanvas = renderer.domElement;
        const compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = window.innerWidth;
        compositeCanvas.height = window.innerHeight;
        const compositeCtx = compositeCanvas.getContext('2d');
        function recordFrame() {
            const vRatio = bgVideo.videoWidth / bgVideo.videoHeight;
            const cRatio = compositeCanvas.width / compositeCanvas.height;
            let sW, sH, sX, sY;
            if (vRatio > cRatio) {
                sH = bgVideo.videoHeight;
                sW = sH * cRatio;
                sX = (bgVideo.videoWidth - sW) / 2;
                sY = 0;
            } else {
                sW = bgVideo.videoWidth;
                sH = sW / cRatio;
                sX = 0;
                sY = (bgVideo.videoHeight - sH) / 2;
            }
            
            compositeCtx.save();
            if (isMirrored) { 
                compositeCtx.translate(compositeCanvas.width, 0); 
                compositeCtx.scale(-1, 1); 
            }
            compositeCtx.drawImage(bgVideo, sX, sY, sW, sH, 0, 0, compositeCanvas.width, compositeCanvas.height);
            compositeCtx.restore();
            
            compositeCtx.drawImage(glCanvas, 0, 0, compositeCanvas.width, compositeCanvas.height);
            
            recorderAnimationId = requestAnimationFrame(recordFrame);
        }
        recordFrame(); 
        const stream = compositeCanvas.captureStream(30); 
        recordedChunks = [];
        try {
            const options = { 
                mimeType: 'video/webm',
                videoBitsPerSecond: 2500000 
            };
            
            mediaRecorder = new MediaRecorder(stream, options);
            mediaRecorder.ondataavailable = (e) => { 
                if (e.data.size > 0) recordedChunks.push(e.data); 
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AR_Video_${Date.now()}.webm`;
                a.click();
                showTempStatus(translations[currentLang].videoSavedToast);
            };
            mediaRecorder.start();
            isRecording = true;
            document.getElementById('arVideoBtn').classList.add('recording');
            showTempStatus(translations[currentLang].videoRecordingToast);
        } catch(e) { 
            alert("录制不支持或出错: " + e.message);
            if(recorderAnimationId) cancelAnimationFrame(recorderAnimationId); 
        }
    }
}
    function showLoading(show, textKey = '') {
        const el = document.getElementById('loadingToast');
        el.style.display = show ? 'flex' : 'none';
        if (show && textKey) {
            const t = translations[currentLang] || translations.zh;
            document.getElementById('loadingText').innerText = t[textKey] || textKey;
        }
    }
function onDragStart(event) {
    event.preventDefault(); 
    
    const touch = event.touches ? event.touches[0] : event;
    if (!touch || !model) return;
    isDragging = true;
    
    pointer.x = (touch.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(touch.clientY / window.innerHeight) * 2 + 1;
    
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObject(model, true);
    
    if (intersects.length > 0) {
        const cameraDirection = camera.getWorldDirection(new THREE.Vector3());
        dragPlane.setFromNormalAndCoplanarPoint(cameraDirection, intersects[0].point);
        if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
            offset.copy(intersection).sub(model.position);
        }
    }
}
function onDragMove(event) {
    event.preventDefault();
    const touch = event.touches ? event.touches[0] : event;
    if (!touch || !isDragging) return;
    pointer.x = (touch.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(touch.clientY / window.innerHeight) * 2 + 1;
    
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
        model.position.copy(intersection.sub(offset));
    }
}
function onDragEnd(event) {
    isDragging = false; 
}
window.switchCamera = async function() {
    const t = translations[currentLang] || translations.zh;

    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
        alert("您的浏览器不支持摄像头切换。");
        return;
    }

    if (arStreamObj) {
        arStreamObj.getTracks().forEach(track => track.stop());
    }

    currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    showLoading(true, 'loadingCamera'); // <-- 此处文本键应为 'loadingCamera'
    try {
        const videoConstraints = {
            facingMode: currentFacingMode,
            width: { ideal: 640 },
            height: { ideal: 480 }
        };

        const newStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
        arStreamObj = newStream;
        const bgVideo = document.getElementById('bgVideo');
        bgVideo.srcObject = newStream;
        await bgVideo.play();
        
        if (currentFacingMode === 'user' && !isMirrored) {
            isMirrored = true;
            bgVideo.classList.add('mirrored');
        } else if (currentFacingMode === 'environment' && isMirrored) {
            isMirrored = false;
            bgVideo.classList.remove('mirrored');
        }
        const camType = t[currentFacingMode === 'user' ? 'camTypeFront' : 'camTypeBack'];
        showTempStatus(t.camSwitchedToast.replace('{camType}', camType));
    } catch (err) {
        alert("切换摄像头失败: " + err.message);
        // 如果失败，恢复到之前的模式
        currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    } finally {
        showLoading(false);
    }
}
const galleryBtn = document.getElementById('galleryBtn');
const galleryModal = document.getElementById('galleryModal');
const closeGallery = document.getElementById('closeGallery');
const galleryImg = document.getElementById('galleryImg');
const prevImg = document.getElementById('prevImg');
const nextImg = document.getElementById('nextImg');

// 替换为你的图片路径数组
const galleryImages = [
  'picture/1.png',
  'picture/2.png',
  'picture/3.png',
  'picture/4.png'
];

let currentIndex = 0;

// 打开弹窗
galleryBtn.onclick = () => {
  galleryModal.style.display = 'flex';
  galleryImg.src = galleryImages[currentIndex];
};

// 关闭弹窗
closeGallery.onclick = () => {
  galleryModal.style.display = 'none';
};

// 左右切换
prevImg.onclick = () => {
  currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
  galleryImg.src = galleryImages[currentIndex];
};
nextImg.onclick = () => {
  currentIndex = (currentIndex + 1) % galleryImages.length;
  galleryImg.src = galleryImages[currentIndex];
};

// === 详情弹窗逻辑补完 ===
const infoBtn = document.getElementById('infoBtn');
const infoModal = document.getElementById('infoModal');
const closeInfo = document.getElementById('closeInfo');

// 1. 点击圆球按钮，显示弹窗
if (infoBtn) {
    infoBtn.onclick = (e) => {
        e.stopPropagation(); // 防止干扰模型点击
        infoModal.style.display = 'flex';
    };
}

// 2. 点击弹窗内的“返回”按钮，隐藏弹窗
if (closeInfo) {
    closeInfo.onclick = () => {
        infoModal.style.display = 'none';
    };
}

// 3. (可选) 点击弹窗黑色背景也可以关闭
infoModal.onclick = (e) => {
    if (e.target === infoModal) {
        infoModal.style.display = 'none';
    }
};
</script>
